<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ממלכת החשבון הקסומה - מסע אינטראקטיבי</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-grad-1: #fef9c3;
      --bg-grad-2: #e0f2fe;
      --bg-grad-3: #fae8ff;
      --primary: #6366f1;
      --primary-dark: #4f46e5;
      --secondary: #ec4899;
      --success: #10b981;
      --warning: #f59e0b;
      --card-bg: rgba(255, 255, 255, 0.94);
      --text-main: #1e293b;
      --text-muted: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Fredoka', 'Rubik', sans-serif;
      background: linear-gradient(135deg, var(--bg-grad-1) 0%, var(--bg-grad-2) 50%, var(--bg-grad-3) 100%);
      min-height: 100vh;
      color: var(--text-main);
      padding: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      background: var(--card-bg);
      border-radius: 28px;
      box-shadow: 0 20px 50px rgba(99, 102, 241, 0.18);
      border: 4px solid #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Top Header & Progress */
    .top-bar {
      background: linear-gradient(90deg, #6366f1, #8b5cf6, #ec4899);
      color: white;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.15);
    }

    .controls-group {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill-btn {
      background: rgba(255, 255, 255, 0.22);
      border: 2px solid rgba(255, 255, 255, 0.5);
      color: white;
      padding: 6px 14px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pill-btn:hover {
      background: rgba(255, 255, 255, 0.35);
      transform: translateY(-1px);
    }

    .stars-badge {
      background: #fef08a;
      color: #854d0e;
      padding: 6px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 1rem;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Voice Studio Drawer */
    .voice-drawer {
      background: #f8fafc;
      border-bottom: 2px solid #e2e8f0;
      padding: 14px 24px;
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .voice-drawer.open {
      display: flex;
    }

    .voice-drawer-row {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
    }

    .voice-control-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.92rem;
      font-weight: 600;
      color: var(--text-muted);
    }

    .voice-control-item select,
    .voice-control-item input[type="range"] {
      padding: 6px 10px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      font-family: inherit;
      background: white;
    }

    .record-panel {
      background: #fff1f2;
      border: 2px dashed #fda4af;
      padding: 10px 16px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }

    .record-btn {
      background: #e11d48;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.2s;
    }

    .record-btn.recording {
      animation: pulseRed 1.2s infinite;
      background: #9f1239;
    }

    @keyframes pulseRed {
      0%, 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(225, 29, 72, 0.6); }
      50% { transform: scale(1.05); box-shadow: 0 0 0 10px rgba(225, 29, 72, 0); }
    }

    /* Station Stepper */
    .stations-nav {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      background: #f1f5f9;
      overflow-x: auto;
      scrollbar-width: thin;
    }

    .station-tab {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 14px;
      border: 2px solid transparent;
      background: white;
      color: var(--text-muted);
      font-family: inherit;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .station-tab.active {
      background: var(--primary);
      color: white;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35);
      transform: translateY(-2px);
    }

    .station-tab.completed {
      border-color: var(--success);
      background: #ecfdf5;
      color: #065f46;
    }

    /* Main Content Area */
    .stage-content {
      padding: 24px;
    }

    .station-header {
      text-align: center;
      margin-bottom: 20px;
    }

    .station-badge {
      display: inline-block;
      background: #e0e7ff;
      color: #4338ca;
      padding: 4px 14px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .station-title {
      font-size: 2rem;
      color: #1e1b4b;
      margin-bottom: 6px;
    }

    /* Song & Story Grid */
    .story-song-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-bottom: 22px;
    }

    @media (max-width: 720px) {
      .story-song-grid {
        grid-template-columns: 1fr;
      }
    }

    .song-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 3px solid #fde68a;
      border-radius: 22px;
      padding: 20px;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .song-card-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #b
